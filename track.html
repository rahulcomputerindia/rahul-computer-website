<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073b75">
  <title>Track Application | RAHUL COMPUTER'S</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 480px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 22px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      color: #073b75;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #087ac2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      overflow-wrap: anywhere;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .result {
      display: none;
      margin-top: 22px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
    }

    .result p {
      margin: 12px 0;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #087ac2;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>RAHUL COMPUTER'S</h2>
  <p class="subtitle">आवेदन की स्थिति जानें</p>

  <input
    type="text"
    id="trackingId"
    maxlength="24"
    placeholder="अपना 24 अक्षर का Tracking ID डालें"
    autocomplete="off"
  >

  <button id="trackBtn" disabled>
    Login जाँचा जा रहा है...
  </button>

  <div id="message"></div>

  <div class="result" id="result">
    <h3>आवेदन विवरण</h3>

    <p><b>Tracking ID:</b> <span id="showId"></span></p>
    <p><b>सेवा:</b> <span id="showService"></span></p>
    <p><b>आवेदन स्थिति:</b> <span class="status" id="showStatus"></span></p>
  </div>

  <a class="back" href="account.html">Customer Dashboard पर जाएँ</a>

  <div class="footer">
    © RAHUL COMPUTER'S
  </div>

</div>

<script type="module">
  import { initializeApp, getApps, getApp }
    from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

  // अपने पुराने track.html से Firebase Config की
  // सभी असली values यहाँ कॉपी करें।
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_EXISTING_API_KEY",
    authDomain: "PASTE_YOUR_EXISTING_AUTH_DOMAIN",
    projectId: "rahul-computer-s",
    storageBucket: "PASTE_YOUR_EXISTING_STORAGE_BUCKET",
    messagingSenderId: "PASTE_YOUR_EXISTING_MESSAGING_SENDER_ID",
    appId: "1:969449083821:web:4696bc1253fa97ea304724"
  };

  const ADMIN_UID = "Fe7XhLLbCGdJ0d9KtqSkqiCNTQG3";

  const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

  const auth = getAuth(app);
  const db = getFirestore(app);

  const trackingInput = document.getElementById("trackingId");
  const trackBtn = document.getElementById("trackBtn");
  const message = document.getElementById("message");
  const result = document.getElementById("result");

  let currentUser = null;
  let authReady = false;

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = type;
  }

  function clearResult() {
    result.style.display = "none";
    message.style.display = "block";
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      location.replace("login.html?next=track.html");
      return;
    }

    currentUser = user;
    authReady = true;
    trackBtn.disabled = false;
    trackBtn.textContent = "आवेदन की स्थिति देखें";
  });

  trackBtn.addEventListener("click", async () => {
    if (!authReady || !currentUser) {
      showMessage("कृपया पहले Login करें।");
      return;
    }

    const trackingId = trackingInput.value.trim().toUpperCase();

    if (!/^[A-F0-9]{24}$/.test(trackingId)) {
      clearResult();
      showMessage("कृपया सही 24 अक्षर का Tracking ID डालें।");
      return;
    }

    trackBtn.disabled = true;
    trackBtn.textContent = "जाँच हो रही है...";
    result.style.display = "none";
    message.style.display = "none";

    try {
      // पहले ग्राहक का मालिकाना हक जाँचें।
      const ownerRef = doc(db, "trackingOwners", trackingId);
      const ownerSnap = await getDoc(ownerRef);

      if (!ownerSnap.exists()) {
        throw new Error("यह Tracking ID आपके खाते से संबंधित नहीं है।");
      }

      const ownerUid = ownerSnap.data().ownerUid;
      const isAdmin = currentUser.uid === ADMIN_UID;

      if (!isAdmin && ownerUid !== currentUser.uid) {
        throw new Error("आप इस आवेदन को देखने के अधिकृत नहीं हैं।");
      }

      // मालिकाना हक सत्यापित होने के बाद Tracking पढ़ें।
      const trackingRef = doc(db, "tracking", trackingId);
      const trackingSnap = await getDoc(trackingRef);

      if (!trackingSnap.exists()) {
        throw new Error("इस Tracking ID का आवेदन रिकॉर्ड नहीं मिला।");
      }

      const data = trackingSnap.data();

      document.getElementById("showId").textContent =
        data.trackingId || trackingId;

      document.getElementById("showService").textContent =
        data.service || "उपलब्ध नहीं";

      document.getElementById("showStatus").textContent =
        data.status || "Pending";

      result.style.display = "block";
      showMessage("आपका आवेदन रिकॉर्ड मिल गया है।", "success");

    } catch (error) {
      console.error("Tracking Error:", error);

      let errorText = error.message || "जानकारी प्राप्त नहीं हो सकी।";

      if (error.code === "permission-denied") {
        errorText = "आपको यह जानकारी देखने की अनुमति नहीं है।";
      }

      showMessage(errorText, "error");

    } finally {
      trackBtn.disabled = false;
      trackBtn.textContent = "आवेदन की स्थिति देखें";
    }
  });
</script>

</body>
</html>
