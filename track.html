ent='जाँच हो रही है...';try{let s=await getDoc(doc(db,'tracking',id));if(!s.exists()){box.textContent='इस ट्रैकिंग नंबर की जानकारी नहीं मिली। नंबर जाँचें या 9752039020 पर संपर्क करें।';return}let d=s.data();box.innerHTML='<b>आवेदन की स्थिति:</b> '+(d.status||'Pending')+'<br><b>सेवा:</b> '+(d.service||'—')+'<br><b>ट्रैकिंग नंबर:</b> '+id;}catch(err){box.textContent='स्थिति नहीं मिल पाई। कृपया कुछ देर बाद प्रयास करें या WhatsApp पर संपर्क करें।';console.error(err)}});</script></body></html>
