<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>आवेदन ट्रैक करें | RAHUL COMPUTER'S</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topline">
  <div class="wrap">RAHUL COMPUTER'S <span>☎ 9752039020</span></div>
</div>

<header class="header">
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <span class="logo">RC</span>
      <span>RAHUL COMPUTER'S<small>Application Tracking</small></span>
    </a>
    <a class="btn outline" href="index.html">← होम</a>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <h1>आवेदन की स्थिति देखें</h1>
    <p>अपना ट्रैकिंग नंबर दर्ज करें।</p>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:650px">
    <div class="panel">
      <form id="trackForm">
        <div class="field">
          <label>ट्रैकिंग नंबर *</label>
          <input id="trackingId" required maxlength="40" placeholder="अपना ट्रैकिंग नंबर डालें">
        </div>
        <button class="btn" style="margin-top:14px" type="submit">स्थिति देखें</button>
      </form>
      <div id="result" class="result"></div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="wrap">
    <div class="copyright">© 2026 RAHUL COMPUTER'S</div>
  </div>
</footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCkpdMXGe1jIsTglSHGinBvZOOtEFmjoKI",
  authDomain: "rahul-computer-s.firebaseapp.com",
  projectId: "rahul-computer-s",
  storageBucket: "rahul-computer-s.firebasestorage.app",
  messagingSenderId: "969449083821",
  appId: "1:969449083821:web:4696bc1253fa97ea304724"
};

const db = getFirestore(initializeApp(firebaseConfig));

document.getElementById('trackForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const id = document.getElementById('trackingId').value.trim().toUpperCase();
  const box = document.getElementById('result');

  box.style.display = 'block';
  box.textContent = 'आवेदन खोजा जा रहा है...';

  try {
    const q = query(
      collection(db, 'applications'),
      where('trackingNumber', '==', id)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
      box.textContent = 'इस ट्रैकिंग नंबर की जानकारी नहीं मिली। नंबर जाँचें या 9752039020 पर संपर्क करें।';
      return;
    }

    const d = snap.docs[0].data();

    box.textContent =
      'आवेदन की स्थिति: ' + (d.status || 'Pending') +
      ' | सेवा: ' + (d.service || '—') +
      ' | ट्रैकिंग नंबर: ' + id;

  } catch (err) {
    box.textContent = 'जानकारी प्राप्त नहीं हो सकी। कृपया कुछ देर बाद प्रयास करें या 9752039020 पर संपर्क करें।';
    console.error(err);
  }
});
</script>

</body>
</html>
