<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b52">
<title>Customer Login | RAHUL COMPUTER'S</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172b4d}
header{background:linear-gradient(110deg,#102b52,#087ac2);color:white;padding:22px 15px;text-align:center}
header h2{margin:0;font-size:24px}
header p{margin:8px 0 0;font-size:14px}
.container{max-width:440px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 22px #102b5215}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#e8eef7;color:#102b52;font-weight:bold;cursor:pointer}
.tabs button.active{background:#1769d2;color:white}
h3{text-align:center;margin:5px 0 20px}
label{display:block;font-weight:bold;font-size:14px;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px}
.action{width:100%;border:0;border-radius:9px;padding:14px;background:#1769d2;color:white;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
.action:disabled{opacity:.6}
.message{text-align:center;margin-top:15px;font-size:14px;line-height:1.5}
a{color:#1769d2;text-decoration:none}
.links{text-align:center;margin-top:20px;font-size:14px}
.hidden{display:none}
footer{text-align:center;color:#667085;font-size:12px;margin-top:20px}
</style>
</head>

<body>

<header>
<h2>RAHUL COMPUTER'S</h2>
<p>Customer Login & Registration</p>
</header>

<div class="container">
<div class="card">

<div class="tabs">
<button id="loginTab" class="active" type="button">Login</button>
<button id="registerTab" type="button">Registration</button>
</div>

<form id="loginForm">
<h3>ग्राहक Login</h3>

<label>Email Address</label>
<input id="loginEmail" type="email" required placeholder="अपना Email डालें">

<label>Password</label>
<input id="loginPassword" type="password" required minlength="6" placeholder="Password डालें">

<button class="action" type="submit">Login करें</button>

<div class="message">
<a href="#" id="forgotPassword">Password भूल गए?</a>
</div>
</form>

<form id="registerForm" class="hidden">
<h3>नया Customer Account बनाएँ</h3>

<label>पूरा नाम</label>
<input id="registerName" type="text" required maxlength="70" placeholder="अपना नाम लिखें">

<label>Mobile Number</label>
<input id="registerMobile" type="tel" required maxlength="10" pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर">

<label>Email Address</label>
<input id="registerEmail" type="email" required placeholder="अपना Email डालें">

<label>Password</label>
<input id="registerPassword" type="password" required minlength="6" placeholder="कम से कम 6 अक्षर">

<label>Confirm Password</label>
<input id="confirmPassword" type="password" required minlength="6" placeholder="Password दोबारा डालें">

<button class="action" type="submit">Account बनाएँ</button>
</form>

<div id="message" class="message" role="status"></div>

<div class="links">
<a href="index.html">← मुख्य वेबसाइट पर जाएँ</a>
</div>

</div>

<footer>RAHUL COMPUTER'S · अमिलिया, मैहर, मध्यप्रदेश</footer>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendPasswordResetEmail,
 updateProfile,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyCkpdMXGe1jIsTglSHGinBvZOOtEFmjoKI",
 authDomain: "rahul-computer-s.firebaseapp.com",
 projectId: "rahul-computer-s",
 storageBucket: "rahul-computer-s.firebasestorage.app",
 messagingSenderId: "969449083821",
 appId: "1:969449083821:web:4696bc1253fa97ea304724"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

const loginForm = $("loginForm");
const registerForm = $("registerForm");
const message = $("message");

function showMessage(text,error=false){
 message.textContent = text;
 message.style.color = error ? "#c62828" : "#16803c";
}

function friendlyError(error){
 const codes = {
  "auth/email-already-in-use":"यह Email पहले से पंजीकृत है। Login करें।",
  "auth/invalid-email":"Email सही नहीं है।",
  "auth/weak-password":"Password कम से कम 6 अक्षरों का रखें।",
  "auth/invalid-credential":"Email या Password गलत है।",
  "auth/user-not-found":"इस Email से कोई Account नहीं मिला।",
  "auth/too-many-requests":"कई बार प्रयास हुआ है। कुछ देर बाद कोशिश करें।",
  "auth/network-request-failed":"Internet कनेक्शन जाँचें।"
 };
 return codes[error.code] || "समस्या हुई: " + error.message;
}

$("loginTab").addEventListener("click",()=>{
 loginForm.classList.remove("hidden");
 registerForm.classList.add("hidden");
 $("loginTab").classList.add("active");
 $("registerTab").classList.remove("active");
 showMessage("");
});

$("registerTab").addEventListener("click",()=>{
 registerForm.classList.remove("hidden");
 loginForm.classList.add("hidden");
 $("registerTab").classList.add("active");
 $("loginTab").classList.remove("active");
 showMessage("");
});

onAuthStateChanged(auth,user=>{
 if(user){
  location.replace("account.html");
 }
});

loginForm.addEventListener("submit",async event=>{
 event.preventDefault();

 const button=loginForm.querySelector('button[type="submit"]');
 button.disabled=true;

 showMessage("Login हो रहा है...");

 try{
  await signInWithEmailAndPassword(
   auth,
   $("loginEmail").value.trim(),
   $("loginPassword").value
  );

  location.replace("account.html");

 }catch(error){
  showMessage(friendlyError(error),true);
  button.disabled=false;
 }
});

registerForm.addEventListener("submit",async event=>{
 event.preventDefault();

 const name=$("registerName").value.trim();
 const mobile=$("registerMobile").value.trim();
 const email=$("registerEmail").value.trim();
 const password=$("registerPassword").value;
 const confirm=$("confirmPassword").value;

 const button=registerForm.querySelector('button[type="submit"]');

 if(!/^[0-9]{10}$/.test(mobile)){
  showMessage("सही 10 अंकों का मोबाइल नंबर डालें।",true);
  return;
 }

 if(password!==confirm){
  showMessage("दोनों Password एक जैसे नहीं हैं।",true);
  return;
 }

 button.disabled=true;
 showMessage("Account बनाया जा रहा है...");

 try{
  const result=await createUserWithEmailAndPassword(
   auth,email,password
  );

  await updateProfile(result.user,{
   displayName:name
  });

  location.replace("account.html");

 }catch(error){
  showMessage(friendlyError(error),true);
  button.disabled=false;
 }
});

$("forgotPassword").addEventListener("click",async event=>{
 event.preventDefault();

 const email=$("loginEmail").value.trim();

 if(!email){
  showMessage("पहले Login वाले बॉक्स में Email डालें।",true);
  return;
 }

 try{
  await sendPasswordResetEmail(auth,email);
  showMessage("Password Reset लिंक आपके Email पर भेज दिया गया है।");

 }catch(error){
  showMessage(friendlyError(error),true);
 }
});

</script>

</body>
</html>
