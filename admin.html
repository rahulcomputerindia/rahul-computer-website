<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#082b55">
<title>RAHUL COMPUTER'S - Admin Panel</title>

<style>
*{box-sizing:border-box}
:root{
  --navy:#082b55;
  --blue:#07569a;
  --royal:#087ac2;
  --gold:#d8ad55;
  --light-gold:#fff7e5;
  --bg:#f3f6fb;
  --text:#172b45;
  --muted:#64748b;
  --border:#dce5ef;
  --green:#16803c;
  --red:#b42318;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:linear-gradient(125deg,#061e3e,#073b75,#087ac2);
  color:white;
  padding:25px 15px;
  text-align:center;
  border-bottom:4px solid var(--gold);
  box-shadow:0 4px 15px #082b5525;
}
.brand-logo{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 10px;
  border:2px solid var(--gold);
  border-radius:14px;
  color:var(--gold);
  font-size:23px;
  font-weight:bold;
  background:#ffffff12;
}
header h2{
  margin:0;
  font-size:25px;
  letter-spacing:1px;
}
header p{
  margin:8px 0 0;
  color:#e6efff;
  font-size:14px;
}
.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 16px 30px;
}
.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  border:1px solid var(--border);
  box-shadow:0 4px 15px #082b550b;
}
.card h3{
  margin:0 0 16px;
  color:var(--navy);
  font-size:19px;
}
.card h4{
  color:var(--navy);
}
input,button,select,textarea{
  width:100%;
  padding:12px 13px;
  margin:8px 0;
  border:1px solid #cbd7e5;
  border-radius:8px;
  font-size:15px;
  font-family:inherit;
}
input,select,textarea{
  background:#fff;
  color:var(--text);
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--royal);
  box-shadow:0 0 0 3px #087ac21a;
}
button{
  background:linear-gradient(120deg,var(--blue),var(--royal));
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
button:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}
.hidden{display:none!important}
.logout,.delete-btn,.reject-btn{
  background:linear-gradient(120deg,#991b1b,#c62828);
}
.excel-btn,.paid-btn{
  background:linear-gradient(120deg,#11632e,#16803c);
}
.edit-btn{
  background:linear-gradient(120deg,#a66a08,#d18a16);
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.stat{
  position:relative;
  overflow:hidden;
  text-align:center;
  background:linear-gradient(145deg,#fff,#f1f7ff);
  padding:20px 12px;
  border:1px solid var(--border);
  border-top:4px solid var(--gold);
  border-radius:13px;
  box-shadow:0 4px 12px #082b5509;
  color:var(--muted);
  font-size:14px;
  font-weight:bold;
}
.stat strong{
  display:block;
  margin-top:8px;
  font-size:29px;
  color:var(--navy);
}
.application{
  border:1px solid var(--border);
  border-left:4px solid var(--royal);
  padding:17px;
  border-radius:12px;
  margin:15px 0;
  background:white;
  box-shadow:0 3px 12px #082b5509;
}
.application h3{
  color:var(--navy);
  margin:0 0 12px;
  font-size:18px;
  overflow-wrap:anywhere;
}
.application p{
  margin:8px 0;
  font-size:14px;
  line-height:1.55;
  overflow-wrap:anywhere;
}
.application select{
  background:#f8fbff;
}
.application button{
  margin-top:7px;
}
.edit-form,.payment-box{
  background:#f4f8fd;
  padding:15px;
  border-radius:10px;
  margin-top:14px;
  border:1px solid #dce7f3;
}
.edit-form{
  border-left:4px solid #d18a16;
}
.payment-box{
  background:linear-gradient(145deg,#fffdf8,#f4f8fd);
  border:1px solid #e8d6ad;
  border-left:4px solid var(--gold);
}
.payment-box h4{
  margin:0 0 12px;
  font-size:16px;
}
.payment-status{
  font-weight:bold;
  color:var(--blue);
  overflow-wrap:anywhere;
}
.paid-text{color:var(--green)}
.rejected-text{color:var(--red)}
#loginBox{
  max-width:440px;
  margin:45px auto;
  border-top:5px solid var(--gold);
}
#loginBox h3{
  text-align:center;
  font-size:22px;
}
#loginMessage{
  text-align:center;
  color:var(--red);
  font-size:14px;
  overflow-wrap:anywhere;
}
.dashboard-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}
.dashboard-heading h3{
  margin:0;
}
.dashboard-heading button{
  width:auto;
  min-width:110px;
  padding:10px 18px;
}
.section-heading{
  display:flex;
  align-items:center;
  gap:9px;
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  margin-bottom:15px;
}
.section-heading span{
  color:var(--gold);
  font-size:20px;
}
#loading{
  color:var(--muted);
  text-align:center;
  padding:15px 5px;
}
footer{
  text-align:center;
  padding:18px 10px;
  color:var(--muted);
  font-size:13px;
}
@media(max-width:600px){
  header{padding:21px 12px}
  header h2{font-size:21px}
  .container{margin:16px auto;padding:0 11px 25px}
  .card{padding:15px;border-radius:11px}
  .stats{gap:7px}
  .stat{padding:13px 4px;font-size:12px}
  .stat strong{font-size:23px}
  .application{padding:13px}
  .application p{font-size:13px}
  .dashboard-heading{align-items:stretch}
  .dashboard-heading button{width:100%}
}
@media(min-width:800px){
  .container{padding-left:22px;padding-right:22px}
  .application{padding:20px}
}
</style>
</head>

<body>

<header>
  <div class="brand-logo">RC</div>
  <h2>RAHUL COMPUTER'S</h2>
  <p>ADMINISTRATION & MANAGEMENT PANEL</p>
</header>

<div class="container">

<div class="card" id="loginBox">
  <h3>Admin Login</h3>
  <p style="text-align:center;color:#64748b;font-size:14px">
    अपने Admin Account से Login करें
  </p>
  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login करें</button>
  <p id="loginMessage"></p>
</div>

<div id="dashboard" class="hidden">

  <div class="card">
    <div class="dashboard-heading">
      <h3>नमस्ते Admin जी! 🙏</h3>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
    <p style="margin:10px 0 0;color:#64748b;font-size:13px">
      RAHUL COMPUTER'S - आपका Admin Dashboard
    </p>
  </div>

  <div class="stats">
    <div class="stat">
      कुल आवेदन
      <strong id="total">0</strong>
    </div>
    <div class="stat">
      Pending
      <strong id="pending">0</strong>
    </div>
    <div class="stat">
      Completed
      <strong id="completed">0</strong>
    </div>
  </div>

  <div class="card">
    <div class="section-heading">
      <span>◆</span>
      <h3 style="margin:0">ग्राहकों के आवेदन</h3>
    </div>

    <button class="excel-btn" id="excelBtn">
      Excel रिपोर्ट डाउनलोड करें
    </button>

    <input type="text" id="searchApplication"
    placeholder="नाम, मोबाइल या Tracking ID से खोजें...">

    <select id="statusFilter">
      <option value="All">सभी आवेदन</option>
      <option value="Pending">केवल Pending आवेदन</option>
      <option value="Completed">केवल Completed आवेदन</option>
    </select>

    <p id="loading">आवेदन लोड हो रहे हैं...</p>
    <div id="applications"></div>
  </div>

</div>
</div>

<footer>
  © RAHUL COMPUTER'S | Admin Panel
</footer>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc,
writeBatch,
updateDoc,
setDoc,
deleteDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCkpdMXGe1jIsTglSHGinBvZOOtEFmjoKI",
authDomain: "rahul-computer-s.firebaseapp.com",
projectId: "rahul-computer-s",
storageBucket: "rahul-computer-s.firebasestorage.app",
messagingSenderId: "969449083821",
appId: "1:969449083821:web:4696bc1253fa97ea304724"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "Fe7XhLLbCGdJ0d9KtqSkqiCNTQG3";

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const loginMessage = document.getElementById("loginMessage");
const applicationsBox = document.getElementById("applications");
const searchInput = document.getElementById("searchApplication");
const statusFilter = document.getElementById("statusFilter");

let currentApplications = [];

function formatDate(timestamp) {
  if (!timestamp) return "उपलब्ध नहीं";

  return new Intl.DateTimeFormat("hi-IN", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: "Asia/Kolkata"
  }).format(timestamp.toDate());
}

function csvCell(value) {
  let text = String(value ?? "");

  if (/^[\s]*[=+\-@]/.test(text)) {
    text = "'" + text;
  }

  return '"' + text.replace(/"/g, '""') + '"';
}

// Excel रिपोर्ट
document.getElementById("excelBtn")
.addEventListener("click", () => {

  if (currentApplications.length === 0) {
    alert("डाउनलोड करने के लिए कोई आवेदन उपलब्ध नहीं है।");
    return;
  }

  const rows = [[
    "ग्राहक का नाम",
    "मोबाइल नंबर",
    "गाँव",
    "सेवा",
    "जानकारी",
    "Tracking ID",
    "आवेदन की तारीख और समय",
    "स्थिति"
  ]];

  currentApplications.forEach(item => {
    const data = item.data;

    rows.push([
      data.customerName || "",
      data.mobile || "",
      data.village || "",
      data.service || "",
      data.details || "",
      data.trackingId || "",
      formatDate(data.createdAt),
      data.status || "Pending"
    ]);
  });

  const csvContent =
    "\uFEFF" +
    rows.map(row =>
      row.map(csvCell).join(",")
    ).join("\r\n");

  const blob = new Blob(
    [csvContent],
    {type: "text/csv;charset=utf-8;"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;

  const today = new Date().toISOString().slice(0,10);
  link.download = "RAHUL_COMPUTERS_Report_" + today + ".csv";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);
  alert("Excel रिपोर्ट डाउनलोड हो गई है।");
});

// Search और Filter
function applyFilters() {

  const query = searchInput.value.trim().toLowerCase();
  const selectedStatus = statusFilter.value;

  document.querySelectorAll(".application").forEach(card => {

    const matchesText =
      card.textContent.toLowerCase().includes(query);

    const matchesStatus =
      selectedStatus === "All" ||
      card.dataset.status === selectedStatus;

    card.style.display =
      matchesText && matchesStatus ? "" : "none";
  });
}

searchInput.addEventListener("input", applyFilters);
statusFilter.addEventListener("change", applyFilters);

// Login
document.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginMessage.textContent = "Email और Password भरें।";
    return;
  }

  loginMessage.textContent = "Login हो रहा है...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    console.error(error);
    loginMessage.textContent =
      "Login नहीं हुआ। Email और Password जाँचें।";
  }
});

// Login Check
onAuthStateChanged(auth, async (user) => {

  if (user && user.uid === ADMIN_UID) {

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");

    await loadApplications();

  } else {

    dashboard.classList.add("hidden");
    loginBox.classList.remove("hidden");

    if (user) {
      await signOut(auth);
      loginMessage.textContent = "आपको Admin की अनुमति नहीं है।";
    }
  }
});

// Logout
document.getElementById("logoutBtn")
.addEventListener("click", async () => {
  await signOut(auth);
});

// Edit Form
function createEditForm(item, card) {

  const data = item.data;

  const form = document.createElement("div");
  form.className = "edit-form";

  const heading = document.createElement("h4");
  heading.textContent = "आवेदन में सुधार करें";
  form.appendChild(heading);

  function addField(label, value) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = label;
    input.value = value || "";
    form.appendChild(input);
    return input;
  }

  const nameInput = addField("ग्राहक का नाम", data.customerName);
  const mobileInput = addField("मोबाइल नंबर", data.mobile);
  const villageInput = addField("गाँव", data.village);
  const serviceInput = addField("सेवा", data.service);

  const detailsInput = document.createElement("textarea");
  detailsInput.placeholder = "आवेदन की जानकारी";
  detailsInput.value = data.details || "";
  detailsInput.rows = 4;
  form.appendChild(detailsInput);

  const saveButton = document.createElement("button");
  saveButton.textContent = "बदलाव Save करें";
  form.appendChild(saveButton);

  const cancelButton = document.createElement("button");
  cancelButton.textContent = "रद्द करें";
  cancelButton.style.background = "#64748b";
  form.appendChild(cancelButton);

  cancelButton.addEventListener("click", () => form.remove());

  saveButton.addEventListener("click", async () => {

    const customerName = nameInput.value.trim();
    const mobile = mobileInput.value.trim();
    const village = villageInput.value.trim();
    const service = serviceInput.value.trim();
    const details = detailsInput.value.trim();

    if (!customerName || !mobile || !village || !service) {
      alert("नाम, मोबाइल, गाँव और सेवा भरना जरूरी है।");
      return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
      alert("कृपया सही 10 अंकों का मोबाइल नंबर भरें।");
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Save हो रहा है...";

    try {

      await updateDoc(
        doc(db, "applications", item.id),
        {customerName, mobile, village, service, details}
      );

      alert("आवेदन की जानकारी सफलतापूर्वक अपडेट हो गई!");
      await loadApplications();

    } catch (error) {

      console.error(error);
      saveButton.disabled = false;
      saveButton.textContent = "बदलाव Save करें";

      alert("जानकारी अपडेट नहीं हुई। Firebase Rules जाँचें।");
    }
  });

  card.appendChild(form);
}

// Payment Management
async function createPaymentBox(item, card) {

  const trackingId = item.data.trackingId;

  if (!trackingId) return;

  const box = document.createElement("div");
  box.className = "payment-box";

  const heading = document.createElement("h4");
  heading.textContent = "भुगतान / Payment Management";
  box.appendChild(heading);

  const amountInput = document.createElement("input");
  amountInput.type = "number";
  amountInput.min = "1";
  amountInput.step = "0.01";
  amountInput.placeholder = "इस आवेदन की फीस रुपये में";
  box.appendChild(amountInput);

  const saveAmountButton = document.createElement("button");
  saveAmountButton.textContent = "फीस Save करें";
  box.appendChild(saveAmountButton);

  const statusText = document.createElement("p");
  statusText.className = "payment-status";
  statusText.textContent = "भुगतान जानकारी लोड हो रही है...";
  box.appendChild(statusText);

  const transactionText = document.createElement("p");
  box.appendChild(transactionText);

  const paidButton = document.createElement("button");
  paidButton.textContent = "भुगतान Paid करें";
  paidButton.className = "paid-btn";
  paidButton.style.display = "none";
  box.appendChild(paidButton);

  const rejectButton = document.createElement("button");
  rejectButton.textContent = "भुगतान Reject करें";
  rejectButton.className = "reject-btn";
  rejectButton.style.display = "none";
  box.appendChild(rejectButton);

  card.appendChild(box);

  let paymentInfo = null;
  let paymentSubmission = null;

  async function refreshPayment() {

    try {

      const results = await Promise.all([
        getDoc(doc(db, "paymentInfo", trackingId)),
        getDoc(doc(db, "paymentSubmissions", trackingId))
      ]);

      paymentInfo = results[0].exists() ? results[0].data() : null;
      paymentSubmission = results[1].exists() ? results[1].data() : null;

      amountInput.value =
        paymentInfo && paymentInfo.amount
          ? paymentInfo.amount
          : "";

      const paymentStatus =
        paymentInfo?.paymentStatus || "फीस तय नहीं हुई";

      statusText.textContent =
        "Payment Status: " + paymentStatus;

      statusText.className = "payment-status";

      if (paymentStatus === "Paid") {
        statusText.classList.add("paid-text");
      }

      if (paymentStatus === "Rejected") {
        statusText.classList.add("rejected-text");
      }

      if (paymentSubmission) {

        transactionText.textContent =
          "ग्राहक का Transaction ID: " +
          paymentSubmission.transactionId;

        if (paymentSubmission.submittedAt) {
          transactionText.textContent +=
            "\nजमा करने का समय: " +
            formatDate(paymentSubmission.submittedAt);
        }

      } else {

        transactionText.textContent =
          "अभी ग्राहक ने Transaction ID जमा नहीं किया है।";
      }

      const canVerify =
        paymentSubmission &&
        paymentStatus !== "Paid";

      paidButton.style.display =
        canVerify ? "block" : "none";

      rejectButton.style.display =
        canVerify ? "block" : "none";

    } catch (error) {

      console.error(error);
      statusText.textContent =
        "Payment जानकारी लोड नहीं हुई।";
    }
  }

  saveAmountButton.addEventListener("click", async () => {

    const amount = Number(amountInput.value);

    if (!Number.isFinite(amount) || amount <= 0) {
      alert("कृपया सही फीस भरें।");
      return;
    }

    saveAmountButton.disabled = true;

    try {

      await setDoc(
        doc(db, "paymentInfo", trackingId),
        {
          amount: amount,
          paymentStatus:
            paymentInfo?.paymentStatus || "Unpaid",
          updatedAt: serverTimestamp()
        },
        {merge: true}
      );

      alert("इस आवेदन की फीस सफलतापूर्वक Save हो गई!");
      await refreshPayment();

    } catch (error) {

      console.error(error);
      alert("फीस Save नहीं हुई। कृपया दोबारा प्रयास करें।");

    } finally {
      saveAmountButton.disabled = false;
    }
  });

  paidButton.addEventListener("click", async () => {

    if (!paymentSubmission) return;

    const confirmPaid = confirm(
      "क्या आपने बैंक/UPI ऐप में पैसा वास्तव में प्राप्त होने की पुष्टि कर ली है?\n\n" +
      "केवल Transaction ID देखकर Paid न करें।"
    );

    if (!confirmPaid) return;

    paidButton.disabled = true;

    try {

      await setDoc(
        doc(db, "paymentInfo", trackingId),
        {
          paymentStatus: "Paid",
          updatedAt: serverTimestamp()
        },
        {merge: true}
      );

      alert("भुगतान Paid कर दिया गया!");
      await refreshPayment();

    } catch (error) {

      console.error(error);
      alert("Payment Status अपडेट नहीं हुआ।");

    } finally {
      paidButton.disabled = false;
    }
  });

  rejectButton.addEventListener("click", async () => {

    if (!paymentSubmission) return;

    const confirmReject = confirm(
      "क्या आप इस Transaction ID को Reject करना चाहते हैं?\n\n" +
      "Reject करने पर ग्राहक दोबारा Transaction ID जमा कर सकेगा।"
    );

    if (!confirmReject) return;

    rejectButton.disabled = true;

    try {

      await setDoc(
        doc(db, "paymentInfo", trackingId),
        {
          paymentStatus: "Rejected",
          updatedAt: serverTimestamp()
        },
        {merge: true}
      );

      await deleteDoc(
        doc(db, "paymentSubmissions", trackingId)
      );

      alert("भुगतान Reject हो गया। ग्राहक दोबारा विवरण जमा कर सकता है।");
      await refreshPayment();

    } catch (error) {

      console.error(error);
      alert("Payment Reject नहीं हुआ।");

    } finally {
      rejectButton.disabled = false;
    }
  });

  await refreshPayment();
}

// सभी आवेदन लोड करना
async function loadApplications() {

  applicationsBox.textContent = "";
  currentApplications = [];

  document.getElementById("loading").textContent =
    "आवेदन लोड हो रहे हैं...";

  try {

    const snapshot =
      await getDocs(collection(db, "applications"));

    let pendingCount = 0;
    let completedCount = 0;

    document.getElementById("total").textContent =
      snapshot.size;

    if (snapshot.empty) {

      document.getElementById("loading").textContent =
        "अभी कोई आवेदन नहीं है।";

      document.getElementById("pending").textContent = "0";
      document.getElementById("completed").textContent = "0";

      return;
    }

    document.getElementById("loading").textContent = "";

    for (const item of snapshot.docs) {

      const data = item.data();

      currentApplications.push({
        id: item.id,
        data: data
      });

      if (data.status === "Completed") {
        completedCount++;
      } else {
        pendingCount++;
      }

      const card = document.createElement("div");
      card.className = "application";
      card.dataset.status = data.status || "Pending";

      const heading = document.createElement("h3");
      heading.textContent = data.customerName || "नाम उपलब्ध नहीं";
      card.appendChild(heading);

      const fields = [
        ["मोबाइल", data.mobile],
        ["गाँव", data.village],
        ["सेवा", data.service],
        ["जानकारी", data.details],
        ["Tracking ID", data.trackingId],
        ["आवेदन की तारीख और समय", formatDate(data.createdAt)],
        ["स्थिति", data.status || "Pending"]
      ];

      fields.forEach(([label, value]) => {

        if (value) {
          const p = document.createElement("p");
          p.textContent = label + ": " + value;
          card.appendChild(p);
        }
      });

      // Status Select
      const select = document.createElement("select");

      ["Pending", "Completed"].forEach(status => {

        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;

        if ((data.status || "Pending") === status) {
          option.selected = true;
        }

        select.appendChild(option);
      });

      // Status Update
      const save = document.createElement("button");
      save.textContent = "Status अपडेट करें";

      save.addEventListener("click", async () => {

        try {

          const batch = writeBatch(db);

          batch.update(
            doc(db, "applications", item.id),
            {status: select.value}
          );

          if (data.trackingId) {
            batch.update(
              doc(db, "tracking", data.trackingId),
              {status: select.value}
            );
          }

          await batch.commit();

          alert("Status अपडेट हो गया!");
          await loadApplications();

        } catch (error) {

          console.error(error);
          alert("अपडेट नहीं हुआ। कृपया दोबारा प्रयास करें।");
        }
      });

      card.appendChild(select);
      card.appendChild(save);

      // Edit Button
      const editButton = document.createElement("button");
      editButton.textContent = "आवेदन Edit करें";
      editButton.className = "edit-btn";

      editButton.addEventListener("click", () => {

        const existingForm = card.querySelector(".edit-form");

        if (existingForm) {
          existingForm.remove();
          return;
        }

        createEditForm({
          id: item.id,
          data: data
        }, card);
      });

      card.appendChild(editButton);

      // Payment Box
      if (data.trackingId) {
        await createPaymentBox({
          id: item.id,
          data: data
        }, card);
      }

      // Delete Button
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "आवेदन Delete करें";
      deleteButton.className = "delete-btn";

      deleteButton.addEventListener("click", async () => {

        const confirmDelete = confirm(
          "क्या आप सचमुच यह आवेदन Delete करना चाहते हैं?\n\n" +
          "इससे आवेदन, Tracking ID और Payment जानकारी हट जाएगी।\n" +
          "यह कार्रवाई वापस नहीं की जा सकती।"
        );

        if (!confirmDelete) return;

        deleteButton.disabled = true;
        deleteButton.textContent = "Delete हो रहा है...";

        try {

          const batch = writeBatch(db);

          batch.delete(
            doc(db, "applications", item.id)
          );

          if (data.trackingId) {

            batch.delete(
              doc(db, "tracking", data.trackingId)
            );

            batch.delete(
              doc(db, "paymentInfo", data.trackingId)
            );

            batch.delete(
              doc(db, "paymentSubmissions", data.trackingId)
            );
          }

          await batch.commit();

          alert("आवेदन सफलतापूर्वक Delete हो गया!");
          await loadApplications();

        } catch (error) {

          console.error(error);

          deleteButton.disabled = false;
          deleteButton.textContent = "आवेदन Delete करें";

          alert("आवेदन Delete नहीं हुआ। कृपया दोबारा प्रयास करें।");
        }
      });

      card.appendChild(deleteButton);
      applicationsBox.appendChild(card);
    }

    document.getElementById("pending").textContent =
      pendingCount;

    document.getElementById("completed").textContent =
      completedCount;

    applyFilters();

  } catch (error) {

    console.error(error);

    document.getElementById("loading").textContent =
      "आवेदन लोड नहीं हुए। इंटरनेट और Firebase Rules जाँचें।";
  }
}

</script>
