<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | RAHUL COMPUTER'S</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topline"><div class="wrap">RAHUL COMPUTER'S <span>सुरक्षित Admin Panel</span></div></div><header class="header"><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">RC</span><span>RAHUL COMPUTER'S<small>Administration</small></span></a><a class="btn outline" href="index.html">वेबसाइट</a></div></header><section class="page-hero"><div class="wrap"><h1>Admin Panel</h1><p>ग्राहक आवेदन और स्थिति प्रबंधन</p></div></section><section class="section"><div class="wrap"><div class="panel" id="loginBox" style="max-width:480px;margin:auto"><h2>Admin Login</h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required></div><button class="btn" style="margin-top:15px">Login</button></form><p id="loginMsg" class="help"></p></div><div id="dashboard" class="hide"><div class="section-head"><div><h2>ग्राहक आवेदन</h2><p id="summary">लोड हो रहा है...</p></div><button class="btn outline" id="logout">Logout</button></div><div class="panel" style="overflow:auto"><table class="admin-table"><thead><tr><th>नाम / मोबाइल</th><th>सेवा / गाँव</th><th>ट्रैकिंग नंबर</th><th>स्थिति</th><th>अपडेट</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';import {getFirestore,collection,getDocs,doc,updateDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js';const firebaseConfig={apiKey:"AIzaSyCkpdMXGe1jIsTglSHGinBvZOOtEFmjoKI",authDomain:"rahul-computer-s.firebaseapp.com",projectId:"rahul-computer-s",storageBucket:"rahul-computer-s.firebasestorage.app",messagingSenderId:"969449083821",appId:"1:969449083821:web:4696bc1253fa97ea304724"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const ADMIN_UID='Fe7XhLLbCGdJ0d9KtqSkqiCNTQG3';const loginBox=document.getElementById('loginBox'),dash=document.getElementById('dashboard');onAuthStateChanged(auth,user=>{if(user&&user.uid===ADMIN_UID){loginBox.classList.add('hide');dash.classList.remove('hide');load()}else{dash.classList.add('hide');loginBox.classList.remove('hide');if(user)signOut(auth)}});document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(err){loginMsg.textContent='Login असफल: '+err.message}};document.getElementById('logout').onclick=()=>signOut(auth);async function load(){let body=document.getElementById('rows');body.innerHTML='';try{let snap=await getDocs(collection(db,'applications'));summary.textContent='कुल '+snap.size+' आवेदन';snap.forEach(item=>{let d=item.data(),tr=document.createElement('tr');let td1=document.createElement('td');td1.textContent=(d.customerName||'')+' / '+(d.mobile||'');let td2=document.createElement('td');td2.textContent=(d.service||'')+' / '+(d.village||'');let td3=document.createElement('td');td3.textContent=d.trackingId||'';let td4=document.createElement('td');let sel=document.createElement('select');['Pending','Processing','Completed','Rejected'].forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;o.selected=(d.status||'Pending')===x;sel.appendChild(o)});td4.appendChild(sel);let td5=document.createElement('td');let b=document.createElement('button');b.className='btn';b.textContent='Save';b.onclick=async()=>{try{await updateDoc(doc(db,'applications',item.id),{status:sel.value});if(d.trackingId)await setDoc(doc(db,'tracking',d.trackingId),{trackingId:d.trackingId,status:sel.value,service:d.service,updatedAt:serverTimestamp()},{merge:true});b.textContent='Saved';}catch(err){alert('अपडेट नहीं हुआ: '+err.message)}};td5.appendChild(b);[td1,td2,td3,td4,td5].forEach(x=>tr.appendChild(x));body.appendChild(tr)})}catch(err){summary.textContent='डेटा लोड नहीं हुआ: '+err.message}}</script></body></html>
