<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHUL COMPUTER'S - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:linear-gradient(120deg,#073b75,#087ac2);color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:20px auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 9px #0001}
input,button,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd5df;border-radius:7px;font-size:16px}
button{background:#087ac2;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.logout,.delete-btn{background:#b42318}
.excel-btn{background:#16803c}
.edit-btn{background:#e18a00}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;background:#e6f2ff;padding:15px;border-radius:9px}
.stat strong{display:block;font-size:25px;color:#07569a}
.application{border:1px solid #dce3eb;padding:13px;border-radius:9px;margin:12px 0;background:white}
.hidden{display:none}
.application button{margin-top:6px}
.edit-form{background:#f1f5f9;padding:12px;border-radius:8px;margin-top:10px}
.edit-form h4{margin-top:0}
@media(max-width:450px){
.stats{gap:5px}
.stat{padding:10px 4px;font-size:13px}
.stat strong{font-size:21px}
}
</style>
</head>

<body>

<header>
<h2>RAHUL COMPUTER'S</h2>
<p>Admin Dashboard</p>
</header>

<div class="container">

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input type="email" id="email" placeholder="Admin Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login करें</button>
<p id="loginMessage"></p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h3>नमस्ते Admin जी!</h3>
<button class="logout" id="logoutBtn">Logout</button>
</div>

<div class="stats">
<div class="stat">कुल आवेदन<strong id="total">0</strong></div>
<div class="stat">Pending<strong id="pending">0</strong></div>
<div class="stat">Completed<strong id="completed">0</strong></div>
</div>

<div class="card">
<h3>ग्राहकों के आवेदन</h3>

<button class="excel-btn" id="excelBtn">
Excel रिपोर्ट डाउनलोड करें
</button>

<input type="text" id="searchApplication"
placeholder="नाम, मोबाइल या Tracking ID से खोजें...">

<select id="statusFilter">
<option value="All">सभी आवेदन</option>
<option value="Pending">केवल Pending आवेदन</option>
<option value="Completed">केवल Completed आवेदन</option>
</select>

<p id="loading">आवेदन लोड हो रहे हैं...</p>
<div id="applications"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
doc,
writeBatch,
updateDoc
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCkpdMXGe1jIsTglSHGinBvZOOtEFmjoKI",
authDomain: "rahul-computer-s.firebaseapp.com",
projectId: "rahul-computer-s",
storageBucket: "rahul-computer-s.firebasestorage.app",
messagingSenderId: "969449083821",
appId: "1:969449083821:web:4696bc1253fa97ea304724"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "Fe7XhLLbCGdJ0d9KtqSkqiCNTQG3";

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const loginMessage = document.getElementById("loginMessage");
const applicationsBox = document.getElementById("applications");
const searchInput = document.getElementById("searchApplication");
const statusFilter = document.getElementById("statusFilter");

let currentApplications = [];

// तारीख और समय
function formatDate(timestamp) {
  if (!timestamp) return "उपलब्ध नहीं";

  return new Intl.DateTimeFormat("hi-IN", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: "Asia/Kolkata"
  }).format(timestamp.toDate());
}

// CSV के लिए सुरक्षित टेक्स्ट
function csvCell(value) {
  let text = String(value ?? "");

  if (/^[\s]*[=+\-@]/.test(text)) {
    text = "'" + text;
  }

  return '"' + text.replace(/"/g, '""') + '"';
}

// Excel रिपोर्ट डाउनलोड
document.getElementById("excelBtn")
.addEventListener("click", () => {

  if (currentApplications.length === 0) {
    alert("डाउनलोड करने के लिए कोई आवेदन उपलब्ध नहीं है।");
    return;
  }

  const rows = [[
    "ग्राहक का नाम",
    "मोबाइल नंबर",
    "गाँव",
    "सेवा",
    "जानकारी",
    "Tracking ID",
    "आवेदन की तारीख और समय",
    "स्थिति"
  ]];

  currentApplications.forEach(item => {

    const data = item.data;

    rows.push([
      data.customerName || "",
      data.mobile || "",
      data.village || "",
      data.service || "",
      data.details || "",
      data.trackingId || "",
      formatDate(data.createdAt),
      data.status || "Pending"
    ]);

  });

  const csvContent =
    "\uFEFF" +
    rows.map(row =>
      row.map(csvCell).join(",")
    ).join("\r\n");

  const blob = new Blob(
    [csvContent],
    {type: "text/csv;charset=utf-8;"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;

  const today = new Date().toISOString().slice(0,10);

  link.download = "RAHUL_COMPUTERS_Report_" + today + ".csv";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);

  alert("Excel रिपोर्ट डाउनलोड हो गई है।");

});

// Search और Status Filter
function applyFilters() {

  const query = searchInput.value.trim().toLowerCase();
  const selectedStatus = statusFilter.value;

  document.querySelectorAll(".application").forEach(card => {

    const matchesText =
      card.textContent.toLowerCase().includes(query);

    const matchesStatus =
      selectedStatus === "All" ||
      card.dataset.status === selectedStatus;

    card.style.display =
      matchesText && matchesStatus ? "" : "none";

  });

}

searchInput.addEventListener("input", applyFilters);
statusFilter.addEventListener("change", applyFilters);

// Admin Login
document.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginMessage.textContent = "Email और Password भरें।";
    return;
  }

  loginMessage.textContent = "Login हो रहा है...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    console.error(error);
    loginMessage.textContent =
      "Login नहीं हुआ। Email और Password जाँचें।";
  }

});

// Login Check
onAuthStateChanged(auth, async (user) => {

  if (user && user.uid === ADMIN_UID) {

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");

    await loadApplications();

  } else {

    dashboard.classList.add("hidden");
    loginBox.classList.remove("hidden");

    if (user) {
      await signOut(auth);
      loginMessage.textContent = "आपको Admin की अनुमति नहीं है।";
    }

  }

});

// Logout
document.getElementById("logoutBtn")
.addEventListener("click", async () => {
  await signOut(auth);
});

// आवेदन Edit Form
function createEditForm(item, card) {

  const data = item.data;

  const form = document.createElement("div");
  form.className = "edit-form";

  const heading = document.createElement("h4");
  heading.textContent = "आवेदन में सुधार करें";
  form.appendChild(heading);

  function addField(label, value, name) {

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = label;
    input.value = value || "";
    input.dataset.field = name;

    form.appendChild(input);
    return input;
  }

  const nameInput = addField(
    "ग्राहक का नाम", data.customerName, "customerName"
  );

  const mobileInput = addField(
    "मोबाइल नंबर", data.mobile, "mobile"
  );

  const villageInput = addField(
    "गाँव", data.village, "village"
  );

  const serviceInput = addField(
    "सेवा", data.service, "service"
  );

  const detailsInput = document.createElement("textarea");
  detailsInput.placeholder = "आवेदन की जानकारी";
  detailsInput.value = data.details || "";
  detailsInput.rows = 4;
  form.appendChild(detailsInput);

  const saveButton = document.createElement("button");
  saveButton.textContent = "बदलाव Save करें";
  form.appendChild(saveButton);

  const cancelButton = document.createElement("button");
  cancelButton.textContent = "रद्द करें";
  cancelButton.style.background = "#64748b";
  form.appendChild(cancelButton);

  cancelButton.addEventListener("click", () => {
    form.remove();
  });

  saveButton.addEventListener("click", async () => {

    const customerName = nameInput.value.trim();
    const mobile = mobileInput.value.trim();
    const village = villageInput.value.trim();
    const service = serviceInput.value.trim();
    const details = detailsInput.value.trim();

    if (!customerName || !mobile || !village || !service) {
      alert("नाम, मोबाइल, गाँव और सेवा भरना जरूरी है।");
      return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
      alert("कृपया सही 10 अंकों का मोबाइल नंबर भरें।");
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Save हो रहा है...";

    try {

      await updateDoc(
        doc(db, "applications", item.id),
        {
          customerName,
          mobile,
          village,
          service,
          details
        }
      );

      alert("आवेदन की जानकारी सफलतापूर्वक अपडेट हो गई!");

      await loadApplications();

    } catch (error) {

      console.error(error);

      saveButton.disabled = false;
      saveButton.textContent = "बदलाव Save करें";

      alert("जानकारी अपडेट नहीं हुई। Firebase Rules जाँचें।");

    }

  });

  card.appendChild(form);
}

// सभी आवेदन लोड करना
async function loadApplications() {

  applicationsBox.textContent = "";
  currentApplications = [];

  document.getElementById("loading").textContent =
    "आवेदन लोड हो रहे हैं...";

  try {

    const snapshot =
      await getDocs(collection(db, "applications"));

    let pendingCount = 0;
    let completedCount = 0;

    document.getElementById("total").textContent =
      snapshot.size;

    if (snapshot.empty) {

      document.getElementById("loading").textContent =
        "अभी कोई आवेदन नहीं है।";

      document.getElementById("pending").textContent = "0";
      document.getElementById("completed").textContent = "0";

      return;
    }

    document.getElementById("loading").textContent = "";

    snapshot.forEach((item) => {

      const data = item.data();

      currentApplications.push({
        id: item.id,
        data: data
      });

      if (data.status === "Completed") {
        completedCount++;
      } else {
        pendingCount++;
      }

      const card = document.createElement("div");
      card.className = "application";
      card.dataset.status = data.status || "Pending";

      const heading = document.createElement("h3");
      heading.textContent = data.customerName || "नाम उपलब्ध नहीं";
      card.appendChild(heading);

      const applicationDate = formatDate(data.createdAt);

      const fields = [
        ["मोबाइल", data.mobile],
        ["गाँव", data.village],
        ["सेवा", data.service],
        ["जानकारी", data.details],
        ["Tracking ID", data.trackingId],
        ["आवेदन की तारीख और समय", applicationDate],
        ["स्थिति", data.status || "Pending"]
      ];

      fields.forEach(([label, value]) => {

        if (value) {
          const p = document.createElement("p");
          p.textContent = label + ": " + value;
          card.appendChild(p);
        }

      });

      // Status Select
      const select = document.createElement("select");

      ["Pending", "Completed"].forEach(status => {

        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;

        if ((data.status || "Pending") === status) {
          option.selected = true;
        }

        select.appendChild(option);

      });

      // Status Update Button
      const save = document.createElement("button");
      save.textContent = "Status अपडेट करें";

      save.addEventListener("click", async () => {

        try {

          const batch = writeBatch(db);

          batch.update(
            doc(db, "applications", item.id),
            {status: select.value}
          );

          if (data.trackingId) {

            batch.update(
              doc(db, "tracking", data.trackingId),
              {status: select.value}
            );

          }

          await batch.commit();

          alert("Status अपडेट हो गया!");

          await loadApplications();

        } catch (error) {

          console.error(error);
          alert("अपडेट नहीं हुआ। कृपया दोबारा प्रयास करें।");

        }

      });

      card.appendChild(select);
      card.appendChild(save);

      // Edit Button
      const editButton = document.createElement("button");
      editButton.textContent = "आवेदन Edit करें";
      editButton.className = "edit-btn";

      editButton.addEventListener("click", () => {

        const existingForm = card.querySelector(".edit-form");

        if (existingForm) {
          existingForm.remove();
          return;
        }

        createEditForm({
          id: item.id,
          data: data
        }, card);

      });

      card.appendChild(editButton);

      // Delete Button
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "आवेदन Delete करें";
      deleteButton.className = "delete-btn";

      deleteButton.addEventListener("click", async () => {

        const confirmDelete = confirm(
          "क्या आप सचमुच यह आवेदन Delete करना चाहते हैं?\n\n" +
          "इससे आवेदन और उसका Tracking ID दोनों हट जाएँगे।\n" +
          "यह कार्रवाई वापस नहीं की जा सकती।"
        );

        if (!confirmDelete) return;

        deleteButton.disabled = true;
        deleteButton.textContent = "Delete हो रहा है...";

        try {

          const batch = writeBatch(db);

          batch.delete(
            doc(db, "applications", item.id)
          );

          if (data.trackingId) {

            batch.delete(
              doc(db, "tracking", data.trackingId)
            );

          }

          await batch.commit();

          alert("आवेदन सफलतापूर्वक Delete हो गया!");

          await loadApplications();

        } catch (error) {

          console.error(error);

          deleteButton.disabled = false;
          deleteButton.textContent = "आवेदन Delete करें";

          alert("आवेदन Delete नहीं हुआ। कृपया दोबारा प्रयास करें।");

        }

      });

      card.appendChild(deleteButton);
      applicationsBox.appendChild(card);

    });

    document.getElementById("pending").textContent =
      pendingCount;

    document.getElementById("completed").textContent =
      completedCount;

    applyFilters();

  } catch (error) {

    console.error(error);

    document.getElementById("loading").textContent =
      "आवेदन लोड नहीं हुए। इंटरनेट और Firebase Rules जाँचें।";

  }

}

</script>
</body>
</html>
