<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase API Diagnostic</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px;color:#172554}
.box{background:white;padding:20px;border-radius:12px}
button{padding:12px;background:#0756a5;color:white;border:0;border-radius:8px}
#result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h2>RAHUL COMPUTER'S</h2>
<h3>Firebase API Test</h3>
<button onclick="testAPI()">Test API Key</button>
<div id="result">Test शुरू करने के लिए बटन दबाएँ।</div>
</div>
<script>
async function testAPI(){
 const result=document.getElementById("result");
 result.textContent="जाँच हो रही है...";
 const apiKey="AIzaSyCkpdMXGe1jIsTglSHGinVbZOOtEFmjoKI";
 try{
  const response=await fetch(
   "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+apiKey,
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({returnSecureToken:false})
   }
  );
  const data=await response.json();
  result.textContent="HTTP Status: "+response.status+
   "\n\nResponse:\n"+JSON.stringify(data,null,2);
 }catch(error){
  result.textContent="Network Error: "+error.message;
 }
}
</script>
</body>
</html>
